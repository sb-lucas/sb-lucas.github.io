        transcript: /assets/pdf/transcript.pdf

    Research Experience:
      - company: Music Technology Group (MTG), Universitat Pompeu Fabra
        position: Full-Time Research Intern
        location: Barcelona, Spain
        start_date: 2025-05
        end_date: 2025-08
        summary: Personalized and interactive music retrieval based on similarity, using audio and text queries.
        highlights:
          - Trained audio-language models with PyTorch and HuggingFace to learn multimodal representations.
          - Processed audio and MIDI data with Essentia, PyFluidSynth, PrettyMIDI and Librosa.
          - Resulted in a paper under review at IEEE TASLPRO.

      - company: ICMC, University of São Paulo
        position: Undergraduate Researcher
        location: São Carlos, Brazil
        start_date: 2024-10
        end_date: present
        summary: Attribute-guided music retrieval using disentangled representation learning (DRL).
        highlights:
          - Applied contrastive learning with PyTorch to generate audio embeddings.
          - Developed a post-hoc DRL method on top of pre-trained audio foundation models, resulting in a paper accepted at LAMIR 2026.

      - company: ICMC, University of São Paulo
        position: Undergraduate Researcher
        location: São Carlos, Brazil
        start_date: 2023-08
        end_date: 2024-07
        summary: Predicting popular songs with graph neural networks (GNNs).
        highlights:
          - Modeled multimodal music data as heterogeneous graphs with NetworkX and PyTorch Geometric, and trained GNNs on them.

      - company: ICMC, University of São Paulo
        position: Undergraduate Researcher
        location: São Carlos, Brazil
        start_date: 2022-08
        end_date: 2023-07
        summary: Evaluating large language models (LLMs) for risk analysis.
        highlights:
          - Used LLM APIs, Pandas, NumPy, Scikit-Learn and Matplotlib to analyze the data and structure the evaluation.

    Student Groups:
      - company: RAIA
        url: https://gruporaia.com/
        position: Member & Leader
        location: ICMC-USP, São Carlos, Brazil
        start_date: 2024-08
        end_date: 2026-09
        summary: RAIA is a student group at ICMC-USP that develops applied artificial intelligence projects in teams of around five undergraduate students. I took part in three of them, as a member and as a leader.
        highlights:
          - "[Leader] <a href='https://github.com/sb-lucas/SyncAM'>Audio-MIDI Alignment</a> (Aug 2025 – Sep 2026): measuring how well audio and MIDI pairs are aligned in piano transcription datasets, under the supervision of researchers from MTG. Resulted in a paper accepted at LAMIR 2026."
          - "[Leader] <a href='https://gruporaia.com/projetos/projeto/tts-autotuning'>TTS AutoTuning</a> (Apr 2025 – Jul 2025): an automated pipeline for fine-tuning text-to-speech models such as XTTS-v2 and Orpheus-TTS, with a dataset builder that creates training data from raw audio using Whisper."
          - "[Member] <a href='https://gruporaia.com/projetos/projeto/ecovision'>EcoVision</a> (Aug 2024 – Dec 2024): a computer vision system that detects hazardous items in waste for Cooperativa Acácia, fine-tuning YOLO for oriented bounding box detection on our own dataset."

      - company: Data ICMC
        url: https://data.icmc.usp.br/
        position: Member & Coordinator
        location: ICMC-USP, São Carlos, Brazil
        start_date: 2023-08
        end_date: 2024-12
        summary: Data ICMC is the Data Science and Artificial Intelligence student group at ICMC-USP. It runs technical projects, events, study groups and courses.
        highlights:
          - Member and coordinator of the Courses team. Taught Python and introductory machine learning to first-year students, and organized both the team and the course content.
          - As coordinator, started and led the group's restructuring, redesigning its structure, roles and teams. Between 2023 and 2024 it went from a shrinking group with few members and little activity to an active one with successful events and courses.

    Skills:
      - name: Programming
        keywords: "Python, PyTorch, Pandas, NumPy, Scikit-Learn, Matplotlib, Librosa, HuggingFace, NetworkX"
      - name: Topics
        keywords: "Representation Learning, Music Information Retrieval, Computer Vision, Graph Neural Networks, NLP, Speech Processing, Deep Learning"

